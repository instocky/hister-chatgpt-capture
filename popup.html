<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Hister Capture</title>
  <style>
    body {
      font: 13px/1.4 -apple-system, "Segoe UI", sans-serif;
      min-width: 300px;
      margin: 0;
      padding: 12px;
      color: #222;
    }
    h1 { font-size: 14px; margin: 0 0 8px; }
    .row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding: 4px 0;
      border-top: 1px solid #eee;
    }
    .row:first-of-type { border-top: 0; }
    .label { color: #666; flex-shrink: 0; }
    .val {
      font-family: ui-monospace, "Consolas", monospace;
      text-align: right;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .state-OK { color: #2a7; font-weight: 600; }
    .state-ERR { color: #d33; font-weight: 600; }
    .state-idle { color: #888; }
    .hint { color: #888; margin-top: 8px; font-size: 11px; }
    code { background: #f4f4f4; padding: 1px 4px; border-radius: 3px; }
    kbd {
      background: #f4f4f4;
      border: 1px solid #ccc;
      border-bottom-width: 2px;
      border-radius: 3px;
      padding: 1px 5px;
      font: 11px ui-monospace, Consolas, monospace;
    }
    button {
      width: 100%;
      margin-top: 10px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 600;
      background: #2a7;
      color: #fff;
      border: 0;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover { background: #1a5; }
    button:disabled { background: #aaa; cursor: default; }
    .btn-err { background: #d33; }
    .btn-err:hover { background: #a22; }
  </style>
</head>
<body>
  <h1>Hister ChatGPT Capture</h1>
  <div id="root">loading…</div>
  <button id="save-btn" type="button">Save thread to clipboard</button>
  <div class="hint">Hotkey: <kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>C</kbd></div>
  <script src="popup.js"></script>
</body>
</html>
